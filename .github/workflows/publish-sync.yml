name: Publish GeoVial.Sync

# STAGE-11 (package) + STAGE-10 (firma) + STAGE-13 (publish) del paquete de sincronizacion
# (09_devops/pipeline-ci-cd, supply-chain-seguridad y guia-publicacion-paquete-github-packages).
# Dispara en tags de version v*: MinVer calcula la version desde el tag; el sufijo
# -alpha.N / -beta.N / -rc.N publica al canal preview; v<X.Y.Z> sin sufijo, al stable.

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read
  packages: write
  id-token: write   # cosign keyless (OIDC de GitHub Actions); sin llaves privadas de larga vida (supply-chain-seguridad §2)

jobs:
  pack-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # MinVer necesita el historial completo y los tags

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack (STAGE-11; MinVer calcula la version)
        run: dotnet pack src/GeoVial.Sync -c Release -o ./artifacts

      - name: Verificar el contenido del .nupkg (DLL + README + nuspec)
        shell: bash
        run: |
          set -e
          pkg=$(ls ./artifacts/GeoVial.Sync.*.nupkg | grep -v '\.snupkg$' | head -1)
          echo "Verificando $pkg"
          contenido=$(unzip -Z1 "$pkg")
          echo "$contenido" | grep -q '^lib/net10.0/GeoVial.Sync.dll$' || { echo "Falta la DLL"; exit 1; }
          echo "$contenido" | grep -q '^README.md$' || { echo "Falta el README"; exit 1; }
          unzip -p "$pkg" 'GeoVial.Sync.nuspec' | grep -q '<id>GeoVial.Sync</id>' || { echo "id incorrecto"; exit 1; }
          echo "Paquete OK"

      - name: Instalar cosign
        uses: sigstore/cosign-installer@v3

      - name: Firmar el paquete con cosign keyless (STAGE-10)
        shell: bash
        env:
          # Identidad y emisor esperados para la verificacion posterior (keyless OIDC).
          COSIGN_IDENTITY_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -e
          for pkg in ./artifacts/GeoVial.Sync.*.nupkg; do
            echo "Firmando $pkg"
            # Firma detached (bundle con certificado + entrada de Rekor); modo keyless via OIDC de Actions.
            cosign sign-blob --yes "$pkg" --bundle "$pkg.cosign.bundle"
            # Verificacion en el propio pipeline: la firma debe validar contra la identidad del workflow.
            cosign verify-blob "$pkg" \
              --bundle "$pkg.cosign.bundle" \
              --certificate-oidc-issuer "$COSIGN_IDENTITY_ISSUER" \
              --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.+"
            echo "Firma OK: $pkg.cosign.bundle"
          done

      - name: Publish a GitHub Packages (STAGE-13)
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate

      - name: Publicar artefactos del paquete (nupkg + firmas)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geovial-sync-nupkg
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.cosign.bundle
          if-no-files-found: warn
