name: Publish GeoVial.Sync

# STAGE-11 (package) + STAGE-09 (SBOM) + STAGE-10 (firma) + STAGE-13 (publish) del paquete de sincronizacion
# (09_devops/pipeline-ci-cd, supply-chain-seguridad y guia-publicacion-paquete-github-packages).
# Dispara en tags de version v*: MinVer calcula la version desde el tag; el sufijo
# -alpha.N / -beta.N / -rc.N publica al canal preview; v<X.Y.Z> sin sufijo, al stable.

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read
  packages: write
  id-token: write   # cosign keyless (OIDC de GitHub Actions); sin llaves privadas de larga vida (supply-chain-seguridad §2)

jobs:
  pack-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # MinVer necesita el historial completo y los tags

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Pack (STAGE-11; MinVer calcula la version)
        # GeneratePackageOnBuild=false SOLO en este pack explicito: en un checkout limpio, la combinacion
        # de GeneratePackageOnBuild=true (que el .csproj mantiene para el test del gate que inspecciona el
        # .nupkg) con 'dotnet pack' provoca NU5026 (la DLL no se encuentra al empaquetar). Desactivarlo aqui
        # hace que pack compile y empaquete en el flujo normal (Build -> Pack). No cambia el .csproj.
        run: dotnet pack src/GeoVial.Sync -c Release -o ./artifacts -p:GeneratePackageOnBuild=false

      - name: Verificar el contenido del .nupkg (DLL + README + nuspec)
        shell: bash
        run: |
          set -e
          pkg=$(ls ./artifacts/GeoVial.Sync.*.nupkg | grep -v '\.snupkg$' | head -1)
          echo "Verificando $pkg"
          contenido=$(unzip -Z1 "$pkg")
          echo "$contenido" | grep -q '^lib/net10.0/GeoVial.Sync.dll$' || { echo "Falta la DLL"; exit 1; }
          echo "$contenido" | grep -q '^README.md$' || { echo "Falta el README"; exit 1; }
          unzip -p "$pkg" 'GeoVial.Sync.nuspec' | grep -q '<id>GeoVial.Sync</id>' || { echo "id incorrecto"; exit 1; }
          echo "Paquete OK"

      - name: Generar SBOM CycloneDX (STAGE-09)
        shell: bash
        run: |
          set -e
          # Version fijada para reproducibilidad: la CLI de CycloneDX cambio entre mayores (en 6.x el flag
          # JSON paso de -j a -F Json), asi que se ancla a 6.2.0 para no romper por upgrades del tool.
          dotnet tool install --global CycloneDX --version 6.2.0
          export PATH="$PATH:$HOME/.dotnet/tools"
          # SBOM (CycloneDX JSON) del paquete con su arbol de dependencias (supply-chain-seguridad §1).
          dotnet CycloneDX src/GeoVial.Sync/GeoVial.Sync.csproj -o ./artifacts -fn geovial-sync.cdx.json -F Json
          test -f ./artifacts/geovial-sync.cdx.json
          echo "SBOM generado: ./artifacts/geovial-sync.cdx.json"

      - name: Instalar cosign
        uses: sigstore/cosign-installer@v3

      - name: Firmar el paquete y el SBOM con cosign keyless (STAGE-10)
        shell: bash
        timeout-minutes: 15
        env:
          # Identidad y emisor esperados para la verificacion posterior (keyless OIDC).
          COSIGN_IDENTITY_ISSUER: https://token.actions.githubusercontent.com
          COSIGN_YES: "true"   # confirma de forma no interactiva (ademas del flag --yes)
        run: |
          set -e
          # Diagnostico (no imprime valores): confirma que el OIDC ambiente de Actions esta disponible.
          echo "OIDC env -> url:${ACTIONS_ID_TOKEN_REQUEST_URL:+si} token:${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+si}"
          cosign version || true
          # 'timeout' de coreutils acota cada llamada keyless (TERM a 240s, KILL a +30s): un cuelgue no bloquea
          # indefinidamente (el timeout-minutes del runner no mata procesos en espera de red) y persiste el log.
          run_cosign() { timeout --kill-after=30 240 "$@"; }
          for artefacto in ./artifacts/GeoVial.Sync.*.nupkg ./artifacts/geovial-sync.cdx.json; do
            echo "Firmando $artefacto"
            # Firma detached (bundle con certificado + entrada de Rekor); modo keyless via OIDC de Actions.
            run_cosign cosign sign-blob --yes "$artefacto" --bundle "$artefacto.cosign.bundle"
            # Verificacion en el propio pipeline: la firma debe validar contra la identidad del workflow.
            run_cosign cosign verify-blob "$artefacto" \
              --bundle "$artefacto.cosign.bundle" \
              --certificate-oidc-issuer "$COSIGN_IDENTITY_ISSUER" \
              --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.+"
            echo "Firma OK: $artefacto.cosign.bundle"
          done

      - name: Publish a GitHub Packages (STAGE-13)
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate

      - name: Publicar artefactos del paquete (nupkg + SBOM + firmas)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: geovial-sync-nupkg
          path: |
            ./artifacts/*.nupkg
            ./artifacts/geovial-sync.cdx.json
            ./artifacts/*.cosign.bundle
          if-no-files-found: warn
